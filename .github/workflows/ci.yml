name: ci

# TEMPORARY development gate for the Android milestone. Actions logs are not
# reachable from the build sandbox, so each run commits its own report to the
# branch. This workflow is deleted before the release tag is pushed; release.yml
# stays the only workflow in the repository, as it was for v0.1 and v0.2.

on:
  push:
    branches: [arena/6aec8a48-social]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    name: gate
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[ci-report]')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rust, native core and APK
        shell: bash
        run: |
          set +e
          mkdir -p ci
          {
            echo "# ci report"
            echo "sha: ${GITHUB_SHA}"
            echo
            echo "## cargo check (workspace)"
            cargo check --workspace --all-targets 2>&1 | tail -n 120
            echo
            echo "## cargo test (workspace)"
            cargo test --workspace 2>&1 | tail -n 60
            echo
            echo "## install cargo-ndk"
            ndk="${ANDROID_NDK_HOME:-}"
            if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
              ndk="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1)"
            fi
            echo "NDK: $ndk"
            export ANDROID_NDK_HOME="$ndk"
            cargo install cargo-ndk --locked 2>&1 | tail -n 5
            echo
            echo "## native core (arm64-v8a)"
            cargo ndk --platform 26 -t arm64-v8a \
              -o apps/android/app/src/main/jniLibs \
              build --release -p social-mail-android-jni 2>&1 | tail -n 80
            echo "ndk_exit=$?"
            echo
            echo "## gradle assembleRelease (unsigned, for compile feedback)"
            cd apps/android
            gradle --no-daemon --console=plain :app:assembleRelease 2>&1 | tail -n 200
            echo "gradle_exit=$?"
          } > ci/report.txt 2>&1
          grep -E "^(ndk|gradle)_exit=" ci/report.txt || true
          wc -l ci/report.txt

      - name: Publish the report
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add -A
            git commit -m "ci: report for ${GITHUB_SHA:0:7} [ci-report]" || true
            git pull --rebase --autostash origin arena/6aec8a48-social || true
            if git push origin HEAD:arena/6aec8a48-social; then
              echo "report pushed"
              exit 0
            fi
            sleep 5
          done
          echo "could not push the report"
          exit 0
