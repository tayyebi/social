name: release

# Every tag produces desktop binaries and an Android APK. Nothing else runs here.
# Tag `v0.3.0` produces:
#   social-mail-v0.3.0-x86_64-unknown-linux-gnu.tar.gz  (+ .sha256)
#   social-mail-v0.3.0-x86_64-pc-windows-msvc.zip       (+ .sha256)
#   social-mail-v0.3.0-android.apk                      (+ .sha256)
#   SHA256SUMS.txt
# The APK is release-signed only when the ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets
# are set; otherwise it is named "-unsigned" and never pretends otherwise.
# This is the only workflow in the repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: |
          rustc -V
          cargo -V

      - name: Test
        shell: bash
        run: cargo test --workspace --release

      - name: Build binaries
        shell: bash
        run: cargo build --release --bins

      - name: Package (linux)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          name="social-mail-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp target/release/social-mail target/release/social-mail-reflector "dist/${name}/"
          cp README.md PLAN.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.sha256")
          rm -rf "dist/${name}"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $name = "social-mail-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/release/social-mail.exe" "dist/$name/"
          Copy-Item "target/release/social-mail-reflector.exe" "dist/$name/"
          Copy-Item "README.md", "PLAN.md" "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii "dist/$name.sha256"
          Remove-Item -Recurse -Force "dist/$name"

      - name: Upload linux archive
        if: matrix.archive == 'tar.gz'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Upload windows archive
        if: matrix.archive == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error


  android:
    name: android apk
    # Builds the APK on every tag. Signed when the four ANDROID_* secrets exist;
    # otherwise the artefact is named "-unsigned" and the release says so.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect the app
        id: detect
        shell: bash
        run: |
          if [ -f apps/android/settings.gradle.kts ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.detect.outputs.has_app == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.has_app == 'true'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: gradle/actions/setup-gradle@v4
        if: steps.detect.outputs.has_app == 'true'
        with:
          gradle-version: '8.9'

      - name: Install cargo-ndk
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_HOME:-}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            ndk="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          echo "using NDK: $ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked

      - name: Build the native core for Android
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo ndk --platform 26 \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o apps/android/app/src/main/jniLibs \
            build --release -p social-mail-android-jni
          find apps/android/app/src/main/jniLibs -name '*.so' -exec ls -l {} +

      - name: Version from the tag
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-v0.3.0}"
          version="${tag#v}"
          IFS='.' read -r major minor patch <<< "$version" || true
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          patch="$(printf '%s' "$patch" | tr -cd '0-9')"
          patch="${patch:-0}"
          code=$(( major * 10000 + minor * 100 + patch ))
          {
            echo "APP_VERSION_NAME=$version"
            echo "APP_VERSION_CODE=$code"
          } >> "$GITHUB_ENV"
          echo "version=$version code=$code"

      - name: Decode the signing key
        id: signing
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            chmod 600 "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing key decoded; this APK will be release-signed."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; building an unsigned APK."
          fi

      - name: Build the APK
        if: steps.detect.outputs.has_app == 'true'
        working-directory: apps/android
        shell: bash
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify the signature and package the APK
        if: steps.detect.outputs.has_app == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(ls apps/android/app/build/outputs/apk/release/*.apk | head -1)"
          echo "built: $apk"
          apksigner="$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          signed=false
          if [ -n "$apksigner" ] && "$apksigner" verify --print-certs "$apk"; then
            signed=true
          fi
          version="${APP_VERSION_NAME:-0.3.0}"
          mkdir -p dist-android
          if [ "$signed" = true ]; then
            name="social-mail-v${version}-android.apk"
          else
            name="social-mail-v${version}-android-unsigned.apk"
          fi
          cp "$apk" "dist-android/$name"
          (cd dist-android && sha256sum "$name" > "$name.sha256")
          ls -l dist-android
          echo "SIGNED=$signed" >> "$GITHUB_ENV"

      - name: Upload the APK
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -l
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          if ls artifacts/*-android-unsigned.apk >/dev/null 2>&1; then
            android_note="The Android APK in this release is UNSIGNED: no signing secrets were configured."
          elif ls artifacts/*-android.apk >/dev/null 2>&1; then
            android_note="The Android APK is release-signed."
          else
            android_note="This release contains no Android APK."
          fi
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --repo "$repo" --clobber
          else
            gh release create "$tag" artifacts/* \
              --repo "$repo" \
              --title "$tag" \
              --generate-notes \
              --notes "Windows and Linux binaries, plus the Android app. ${android_note} Verify every download with SHA256SUMS.txt before running it."
          fi
