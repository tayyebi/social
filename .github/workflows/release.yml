name: release

# Windows and Linux binaries for every tag. Nothing else runs here.
# Tag `v0.2.0` produces:
#   social-mail-v0.2.0-x86_64-unknown-linux-gnu.tar.gz  (+ .sha256)
#   social-mail-v0.2.0-x86_64-pc-windows-msvc.zip       (+ .sha256)
#   SHA256SUMS.txt
# This is the only workflow in the repository: branch CI was a temporary gate for
# this phase and was removed once it was green on Linux and Windows.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: |
          rustc -V
          cargo -V

      - name: Test
        shell: bash
        run: cargo test --workspace --release

      - name: Build binaries
        shell: bash
        run: cargo build --release --bins

      - name: Package (linux)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          name="social-mail-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp target/release/social-mail target/release/social-mail-reflector "dist/${name}/"
          cp README.md PLAN.md "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.sha256")
          rm -rf "dist/${name}"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $name = "social-mail-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/release/social-mail.exe" "dist/$name/"
          Copy-Item "target/release/social-mail-reflector.exe" "dist/$name/"
          Copy-Item "README.md", "PLAN.md" "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii "dist/$name.sha256"
          Remove-Item -Recurse -Force "dist/$name"

      - name: Upload linux archive
        if: matrix.archive == 'tar.gz'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Upload windows archive
        if: matrix.archive == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -l
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --repo "$repo" --clobber
          else
            gh release create "$tag" artifacts/* \
              --repo "$repo" \
              --title "$tag" \
              --generate-notes \
              --notes "Windows and Linux binaries. Verify with SHA256SUMS.txt before running."
          fi
